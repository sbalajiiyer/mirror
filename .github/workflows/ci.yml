name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mirror
          POSTGRES_PASSWORD: mirror
          POSTGRES_DB: mirror
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mirror" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mirror:mirror@localhost:5432/mirror?schema=public
      TEST_DATABASE_URL: postgresql://mirror:mirror@localhost:5432/mirror_test?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      CRON_SECRET: ci-cron
      DEV_TOOLS_ENABLED: "true"
      DEMO_LOGIN_ENABLED: "true"
      AI_PROVIDER: mock
      # Test-only password for the unlinked /tech page (not the real one).
      TECH_PAGE_PASSWORD_HASH: "scrypt$0TGsHmelH_nVY5CFQMSxMw$LFevrCCrSUSS--6SjPMu4F-DvqkiRTepz20GqEL0mcM"
      E2E_TECH_PASSWORD: ci-tech-page-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrate databases
        run: |
          npx prisma migrate deploy
          PGPASSWORD=mirror psql -h localhost -U mirror -d mirror -c "CREATE DATABASE mirror_test"
          DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy
      - run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
